[workspace]
members = ["verso", "versoview_messages", "versoview_build"]

[workspace.package]
version = "0.0.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
homepage = "https://versotile.org/verso"
repository = "https://github.com/xeonn/verso"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ipc-channel = "0.23"
bincode = "1"
url = { version = "2.5.2", features = ["serde"] }
log = "0.4"
headers = "0.4"
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dpi = { version = "0.1", features = ["serde"] }

[package]
name = "versoview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An innovative web browser"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.versotile.org/verso"
categories = ["web-programming"]

[package.metadata.packager]
name = "verso"
product-name = "verso"
identifier = "org.versotile.verso"
version = "0.0.3"
before-each-package-command = "python etc/package_libs.py"
resources = [
  "resources",
  "icons",
  "target/release/build/**/libEGL.dll",
  "target/release/build/**/libGLESv2.dll",
  "target/release/lib",
]
icons = ["icons/icon256x256.png", "icons/icon.ico"]

[package.metadata.packager.nsis]
appdata-paths = ["$LOCALAPPDATA/$IDENTIFIER"]

[package.metadata.docs.rs]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
]

[features]
default = []
bluetooth = ["servo/bluetooth"]
background_hang_monitor = ["servo/background_hang_monitor"]
vello = ["servo/vello"]
packager = ["dep:cargo-packager-resource-resolver"]
flatpak = []
tracing = []

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
crossbeam-channel = "0.5"
env_logger = "0.11"
euclid = "0.22"
getopts = "0.2.17"
ipc-channel = { workspace = true }
keyboard-types = { version = "0.8.3", features = ["webdriver", "serde"] }
log = { workspace = true }
raw-window-handle = { version = "0.6", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2"
winit = { version = "0.30.13", features = ["rwh_06"] }
dpi = { workspace = true }
url = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
versoview_messages = { path = "./versoview_messages" }
serde = { workspace = true }
serde_json = "1.0"
bincode = { workspace = true }
mime = "0.3"
uuid = { workspace = true }
rfd = "0.15"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
bitflags = "2.9"
surfman = "0.14"
servo = { version = "0.7.0", features = [
  "brotli-compression-stream",
  "webcrypto",
  "webgl",
  "webgpu",
] }
# Packager feature
cargo-packager-resource-resolver = { version = "0.1.1", features = [
  "auto-detect-format",
], optional = true }
chrono = "0.4.41"
percent-encoding = "2.3.1"
directories = "6.0.0"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
notify-rust = { version = "4.11.5", features = ["images"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = "4.11.5"
muda = "0.15"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }
objc2-app-kit = { version = "0.2", features = [
  "NSView",
  "NSResponder",
  "NSWindow",
] }

[profile.release-lto]
inherits = "release"
lto = true

# Tell clippy to allow e.g. #[cfg(macos)]
[lints.rust]
unexpected_cfgs = "allow"
